<!doctype html>
<!-- Vị trí file: wp-content/gb-tools/seo-tools/chuyen-doi-anh-sang-base64.html -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công cụ chuyển đổi ảnh sang Base64 online - Image to Base64</title>
<meta name="description" content="Chuyển đổi hình ảnh sang chuỗi mã hóa Base64 trực tuyến nhanh chóng. Nhấp chuột, kéo thả hoặc dán ảnh từ clipboard trực tiếp trên trình duyệt.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: Roboto, ui-sans-serif, system-ui, sans-serif;
    --color-primary: #fdca1e; --color-primary-hover: #e8b008; --color-primary-soft: #fffbeb;
    --color-primary-ink: #9c6406; --color-ink: #0f172a; --color-neutral: #e2e8f0;
  }
</style>
</head>
<body class="bg-white font-sans text-ink antialiased" onpaste="handlePaste(event)">
<main class="mx-auto max-w-4xl p-4 sm:p-6 space-y-6">
  
  <div class="bg-white border border-neutral rounded-2xl p-6 shadow-xs space-y-6">
    
    <!-- Khung tải lên tệp ảnh (Drag & Drop & Paste & Click) -->
    <div id="dropZone" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)" class="border-2 border-dashed border-neutral hover:border-primary rounded-2xl p-8 transition-colors cursor-pointer bg-slate-50/30 flex flex-col items-center justify-center space-y-3 text-center" onclick="document.getElementById('fileInput').click()">
      
      <!-- Icon Code tương tự mẫu -->
      <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
      
      <div class="space-y-1">
        <div class="font-bold text-sm text-ink">Nhấp chuột để tải lên</div>
        <div class="text-xs text-slate-400">hoặc thả ảnh</div>
        <div class="text-xs text-slate-400">hoặc dán từ clipboard</div>
        <div class="text-xs text-slate-500 pt-1">Hỗ trợ nhấp chuột, kéo thả hoặc dán.</div>
      </div>

      <button type="button" class="mt-2 min-h-10 rounded-xl bg-primary px-6 font-bold text-xs text-ink hover:bg-primary-hover shadow-xs cursor-pointer">
        Chọn tệp
      </button>

      <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
    </div>

    <!-- Khu vực hiển thị kết quả (Ẩn khi chưa có ảnh) -->
    <div id="resultSection" class="space-y-3 hidden">
      
      <!-- Thanh công cụ phía trên khung kết quả -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div id="lengthInfo" class="text-xs font-semibold text-slate-600">Độ dài chuỗi Base64: 0 ký tự</div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="copyOutput()" class="text-xs font-bold text-primary-ink hover:underline cursor-pointer px-3 py-1.5 rounded-lg border border-neutral hover:border-primary bg-white">Sao chép</button>
          <button type="button" onclick="downloadResultFile()" class="text-xs font-bold text-primary-ink hover:underline cursor-pointer px-3 py-1.5 rounded-lg border border-neutral hover:border-primary bg-white flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Tải xuống
          </button>
        </div>
      </div>

      <!-- Textarea chứa chuỗi Base64 -->
      <div>
        <textarea id="outputResult" rows="7" readonly placeholder="Chuỗi mã hóa Base64 sẽ xuất hiện ở đây..." class="w-full rounded-xl border border-neutral p-3.5 text-xs font-mono outline-none bg-slate-50 resize-y leading-relaxed select-all"></textarea>
      </div>

    </div>

  </div>

</main>

<script>
  function handleDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('border-primary', 'bg-primary-soft/30');
  }

  function handleDragLeave(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('border-primary', 'bg-primary-soft/30');
  }

  function handleDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('border-primary', 'bg-primary-soft/30');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      processImageFile(e.dataTransfer.files[0]);
    }
  }

  function handleFileSelect(e) {
    if (e.target.files && e.target.files[0]) {
      processImageFile(e.target.files[0]);
    }
  }

  // Hỗ trợ dán ảnh trực tiếp từ Clipboard (Ctrl + V)
  function handlePaste(e) {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        const blob = items[i].getAsFile();
        processImageFile(blob);
        break;
      }
    }
  }

  async function gbCopy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok;
  }

  function processImageFile(file) {
    if (!file.type.startsWith('image/')) {
      alert('Vui lòng chọn tệp hình ảnh hợp lệ!');
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64String = e.target.result;
      document.getElementById('outputResult').value = base64String;
      
      // Định dạng số lượng ký tự có dấu phân cách hàng nghìn cho đẹp
      const formattedLen = base64String.length.toLocaleString('vi-VN');
      document.getElementById('lengthInfo').textContent = `Độ dài chuỗi Base64: ${formattedLen} ký tự`;

      document.getElementById('resultSection').classList.remove('hidden');
    };
    reader.readAsDataURL(file);
  }

  async function copyOutput() {
    const val = document.getElementById('outputResult').value;
    if (!val) return;
    const ok = await gbCopy(val);
    if (ok) alert('Đã sao chép chuỗi Base64 vào bộ nhớ tạm!');
  }

  function downloadResultFile() {
    const val = document.getElementById('outputResult').value;
    if (!val) return;
    const blob = new Blob([val], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: 'base64-output.txt' });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
</script>
</body>
</html>
